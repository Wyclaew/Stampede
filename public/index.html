<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stampede · sabırsız kullanıcı sürüsü</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1015'/><path d='M7 6v14l4-3.5 2.6 6 2.6-1.1-2.6-5.9H19z' fill='%235aea98'/><path d='M17 4v9l2.6-2.3 1.7 3.9 1.7-.7-1.7-3.8H25z' fill='%2374aef5'/></svg>">
  <link rel="preload" href="/vendor/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 3v10l8-5z" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 1.8h5.3L12.5 5v9.2h-8.5z M9 1.8V5.3h3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-code" viewBox="0 0 16 16"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="4.9" r=".95" fill="currentColor"/></symbol>
    <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8 6.6 6.6z" fill="currentColor"/></symbol>
  </svg>

  <header class="bar">
    <a class="brand" href="/" aria-label="Stampede">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5v15l4.2-3.7 2.7 6.2 2.7-1.2-2.7-6.1H19z" fill="var(--signal)"/><path d="M17 3v9.5l2.7-2.4 1.8 4 1.8-.8-1.8-3.9H26z" fill="#74aef5"/></svg>
      <span class="word">Stampede</span>
    </a>
    <button class="info" type="button" data-tip="Stampede uygulamanıza aynı anda birden fazla sabırsız kullanıcı gönderir: her biri ayrı bir sekmede kendi tarzında saldırır. Kırılan her şey ekran görüntülü bir rapora ve çalıştırılabilir bir Playwright testine dönüşür. Kaynak kod gerekmez."><svg><use href="#i-info"/></svg></button>
    <div class="bar-right">
      <span class="ai-badge" id="aiBadge" hidden><svg><use href="#i-spark"/></svg><span id="aiBadgeText">AI</span></span>
      <div class="run-state" id="runState" data-phase="idle">
        <span class="state-label" id="stateLabel">Hazır</span>
        <span class="clock mono" id="clock">00:00</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="setup panel" aria-label="Görev ayarları">
      <div class="field">
        <div class="label-row"><label class="label" for="url">Hedef adres</label></div>
        <input id="url" class="mono" type="url" value="http://localhost:7500/" spellcheck="false" autocomplete="off">
        <div class="quick" role="group" aria-label="Hazır hedefler">
          <button type="button" class="link-btn" data-url="http://localhost:7500/">Demo · hatalı</button>
          <button type="button" class="link-btn" data-url="http://localhost:7500/?fixed=1">Demo · düzgün</button>
          <button type="button" class="link-btn" data-url="https://biyom.co/" data-mode="safe">biyom.co</button>
        </div>
      </div>

      <fieldset class="group">
        <div class="label-row">
          <legend class="label">Mod</legend>
          <button class="info" type="button" data-tip="Güvenli: canlı siteler için. Tüm yazma istekleri (POST/PUT/DELETE) ağda engellenir, ödeme/silme/çıkış butonlarına dokunulmaz, formlar gönderilmez.&#10;Kaos: lokal ve staging için. Gerçek gönderimler, giriş/kayıt, bağlantı kesme, ikinci sekme.&#10;Stres: sadece lokal. CPU 4× yavaş, yavaş 3G, API yanıtlarını yolda bozma, sil butonları dahil."><svg><use href="#i-info"/></svg></button>
        </div>
        <div class="seg" role="radiogroup" aria-label="Mod">
          <label><input type="radio" name="mode" value="safe"><span>Güvenli</span></label>
          <label><input type="radio" name="mode" value="chaos" checked><span>Kaos</span></label>
          <label class="danger-opt"><input type="radio" name="mode" value="stress"><span>Stres</span></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <div class="label-row">
          <legend class="label">Sürü</legend>
          <span class="count-pill mono" id="swarmCount">4 / 8</span>
        </div>
        <div class="personas" id="personaPicker"></div>
      </fieldset>

      <fieldset class="group">
        <div class="label-row">
          <legend class="label">Test kimliği</legend>
          <button class="info" type="button" data-tip="Ajanlar giriş ve kayıt formlarını bu kimlikle doldurur: önce kayıt olur, sonra aynı kimlikle giriş yapar. Boş bırakırsanız .env'deki STAMPEDE_EMAIL/STAMPEDE_PASSWORD, o da yoksa her koşuya özel otomatik bir hesap kullanılır. Google, Apple, GitHub ve '… ile giriş' butonlarına hiçbir modda basılmaz. Şifre raporlarda maskelenir."><svg><use href="#i-info"/></svg></button>
        </div>
        <div class="row2">
          <input id="email" type="email" autocomplete="off" placeholder="e-posta (otomatik)" aria-label="Test e-postası">
          <input id="password" type="password" autocomplete="new-password" placeholder="şifre (otomatik)" aria-label="Test şifresi">
        </div>
      </fieldset>

      <div class="row2">
        <label class="field"><span class="label">Süre</span>
          <select id="duration"><option value="20">20 sn</option><option value="30">30 sn</option><option value="45" selected>45 sn</option><option value="60">60 sn</option><option value="120">2 dk</option><option value="300">5 dk</option></select>
        </label>
        <label class="field"><span class="label">Seed</span><input id="seed" class="mono" type="number" inputmode="numeric" placeholder="rastgele"></label>
      </div>

      <div class="toggles">
        <label class="switch"><input id="headed" type="checkbox"><span class="track"></span><span>Pencereleri göster</span>
          <button class="info" type="button" data-tip="Her ajan için gerçek bir Chrome penceresi açar ve ekranı ızgara halinde paylaştırır. Başlarken farenizi ekranın üst kenarına taşırız; ajan imleçleri sizin farenizi dinlemez."><svg><use href="#i-info"/></svg></button></label>
        <label class="switch" id="resetRow"><input id="resetDemo" type="checkbox" checked><span class="track"></span><span>Demoyu sıfırla</span>
          <button class="info" type="button" data-tip="Demo mağazasında önceki koşudan kalan siparişler, hesaplar ve sepet her başlatmada silinir. Sadece dahili demo için geçerlidir."><svg><use href="#i-info"/></svg></button></label>
        <label class="switch" id="aiRow"><input id="aiToggle" type="checkbox" checked><span class="track"></span><span>AI (Gemini)</span>
          <button class="info" type="button" id="aiTip" data-tip="Açıkken: koşu başında sayfa yapısından bir saldırı planı çıkarılır, sonunda ekran görüntüleri görsel kusurlar için incelenir ve tüm bulgular kök nedenlerine göre özetlenir. Sayfa özeti ve ekran görüntüleri Google Gemini'ye gönderilir."><svg><use href="#i-info"/></svg></button></label>
      </div>

      <label class="consent" id="liveConfirm" hidden>
        <input id="confirmLive" type="checkbox">
        <span>Canlı site: bu mod gerçek sipariş, form ve giriş isteği gönderebilir. <b>Sitenin sahibiyim.</b></span>
      </label>
      <div class="actions">
        <button id="start" class="primary" type="button"><svg><use href="#i-play"/></svg>Başlat</button>
        <button id="stop" class="secondary" type="button" disabled><svg><use href="#i-stop"/></svg>Durdur</button>
      </div>
      <p id="formError" class="form-error" role="alert"></p>
    </section>

    <section class="swarm" aria-label="Sürü">
      <div class="tiles" id="tiles" data-count="0"></div>

      <article class="brain panel" aria-labelledby="brain-title">
        <div class="panel-head">
          <h2 id="brain-title">Karar grafiği</h2>
          <button class="info" type="button" data-tip="Ajanların beyni. Solda hedef aldıkları sayfa bölgesi, ortada seçtikleri hamle ve olasılık dağılımı (çubuklar: en olası 6 aday), sağda sonuç. 'Tümü' tüm ajanları kendi renklerinde gösterir; bir ajana tıklayınca o ajanın tarttığı tüm adayları görürsünüz. AI işaretli hamleler Gemini planından gelir."><svg><use href="#i-info"/></svg></button>
          <div class="brain-tabs" id="brainTabs" role="tablist"></div>
        </div>
        <canvas id="brain" height="320" aria-label="Ajanların karar grafiği"></canvas>
        <p class="brain-caption mono" id="brainCaption"></p>
      </article>
    </section>

    <section class="findings" aria-label="Bulgular">
      <div class="panel score-panel">
        <div class="score-row">
          <div>
            <div class="label-row"><span class="label">Dayanıklılık</span>
              <button class="info" type="button" data-tip="100'den başlar; her farklı sorun önemine göre düşürür: Kritik −25, Yüksek −12, Orta −5, Düşük −2. Altındaki çubuklar kategori karnesidir; her kategori kendi sorunlarıyla 100'den düşer."><svg><use href="#i-info"/></svg></button></div>
            <b class="score mono" id="score">100</b>
            <span class="grade" id="grade">—</span>
          </div>
          <svg class="history" id="history" viewBox="0 0 160 48" preserveAspectRatio="none" aria-label="Skor geçmişi"><polyline id="historyLine" fill="none" stroke="currentColor" stroke-width="1.6" points="0,4 160,4"/></svg>
        </div>
        <ul class="sev-counts" id="sevCounts"></ul>
        <ul class="cats" id="cats"></ul>
        <dl class="stats mono" id="stats"></dl>
      </div>

      <div class="panel ai-panel" id="aiPanel" hidden>
        <div class="panel-head"><h2><svg class="spark"><use href="#i-spark"/></svg>AI</h2><span class="sub mono" id="aiModel"></span></div>
        <p class="ai-summary" id="aiSummary"></p>
        <ol class="ai-steps" id="aiSteps"></ol>
        <div id="aiFixes"></div>
      </div>

      <div class="panel report-panel" id="reportPanel" hidden>
        <div class="panel-head"><h2>Rapor</h2><span class="sub" id="reportText"></span></div>
        <div class="report-links" id="reportLinks"></div>
      </div>

      <div class="panel list-panel">
        <nav class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="issues">Sorunlar <span class="count" id="tIssues">0</span></button>
          <button role="tab" aria-selected="false" data-tab="feed">Hamleler</button>
          <button role="tab" aria-selected="false" data-tab="anoms">Ağ · konsol <span class="count" id="tAnoms">0</span></button>
        </nav>
        <div class="list" id="panel-issues"><p class="empty">Sorunlar önem sırasına göre burada listelenir.</p></div>
        <div class="list" id="panel-feed" hidden></div>
        <div class="list" id="panel-anoms" hidden></div>
      </div>
    </section>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
